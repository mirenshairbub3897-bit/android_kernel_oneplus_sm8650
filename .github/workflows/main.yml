name: Build Module Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Forked Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Install Modern Compiling Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev llvm clang

    - name: Cache Android Clang Toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/toolchain
        key: clang-toolchain-android-latest

    - name: Get Android Clang Compiler
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ github.workspace }}/toolchain
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 ${{ github.workspace }}/toolchain --depth=1

    - name: Prepare Kernel Configuration
      run: |
        cd ${{ github.workspace }}/gki-kernel
        
        # Environment variables setup
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # Naye toolchain path ko explicit fix kiya hai
        export PATH="${{ github.workspace }}/toolchain/clang-r485591/bin:$PATH"
        
        # Agar clang-r485591 folder na ho toh direct bin check karega
        if [ ! -d "${{ github.workspace }}/toolchain/clang-r485591" ]; then
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
        fi
        
        # .config ko verify karein (Jo gki-kernel folder me aapne dali hai)
        make CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

    - name: Build Module (.ko)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # Path safety fix
        export PATH="${{ github.workspace }}/toolchain/clang-r485591/bin:$PATH"
        if [ ! -d "${{ github.workspace }}/toolchain/clang-r485591" ]; then
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
        fi
        
        # filetest folder me jaakar compile karein
        cd ${{ github.workspace }}/filetest
        
        # KDIR ko point karein aapke gki-kernel folder ki taraf
        make CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KDIR=${{ github.workspace }}/gki-kernel

    - name: Upload Finished Module
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus-13R-Module
        path: filetest/*.ko
