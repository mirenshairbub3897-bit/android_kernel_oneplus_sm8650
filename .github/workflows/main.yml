name: Build Module Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Forked Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Install Modern Compiling Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev llvm clang wget

    # --- FIX: Google Repo hatakar direct 300MB ka zip download karenge ---
    - name: Get Specific Android Clang Compiler (Fast)
      run: |
        mkdir -p ${{ github.workspace }}/toolchain
        cd ${{ github.workspace }}/toolchain
        
        # GKI 2.0 (Kernel 6.1) ke liye exact r485591 stable version download kar rhe hain
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r485591.tar.gz
        
        # Isko extract karenge
        tar -xzf clang-r485591.tar.gz
        rm clang-r485591.tar.gz
    # -----------------------------------------------------------------

    - name: Prepare Kernel Configuration
      run: |
        cd ${{ github.workspace }}/gki-kernel
        
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # Toolchain path direct setting
        export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
        
        # .config ko ready karein
        make CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

    - name: Build Module (.ko)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
        
        cd ${{ github.workspace }}/filetest
        make CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KDIR=${{ github.workspace }}/gki-kernel

    - name: Upload Finished Module
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus-13R-Module
        path: filetest/*.ko
