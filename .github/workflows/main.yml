name: Build Module Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Forked Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Install Essential Build Tools & Linker
      run: |
        sudo apt-get update
        # Built-in Clang ke sath 'lld' package dalna zaroori hai ld.lld ke liye
        sudo apt-get install -y bc bison flex libelf-dev libssl-dev rsync lld clang llvm

    - name: Prepare Kernel Configuration
      run: |
        cd ${{ github.workspace }}
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # LLVM=1 ke sath target triple diya hai taaki built-in compiler sahi se configure ho
        make LLVM=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

    - name: Build Module (.ko)
      run: |
        cd ${{ github.workspace }}/filetest
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Built-in compiler se direct module compilation
        make LLVM=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- KDIR=${{ github.workspace }}

    - name: Upload Finished Module
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus-13R-Module
        path: filetest/*.ko
