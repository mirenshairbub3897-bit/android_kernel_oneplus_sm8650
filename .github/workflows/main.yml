name: Build Module From Forked Repo

on:
  workflow_dispatch: # Taaki aap GitHub website se click karke jab chahein chala sakein

jobs:
  build-ko:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Forked Code
      uses: actions/checkout@v4
      with:
        # Isse aapka wahi branch checkout hoga jisme aap kaam kar rhe hain (Default Branch)
        ref: ${{ github.ref_name }}

    - name: Install Compiling Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libelf-dev libssl-dev bison flex git crossbuild-essential-arm64

    - name: Get Android Clang Compiler
      run: |
        mkdir -p ${{ github.workspace }}/toolchain
        cd ${{ github.workspace }}/toolchain
        # Kernel compile karne ke liye official Android Clang compiler download kar rhe hain
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 prebuilts-clang --depth=1

    - name: Verify and Prepare Kernel Config
      run: |
        cd ${{ github.workspace }}/gki-kernel
        
        # Architecture aur Tools ka rasta compiler ko de rhe hain
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH="${{ github.workspace }}/toolchain/prebuilts-clang/clang-r485591/bin:$PATH"
        
        # Agar aapki .config file folder me hai, toh yeh use kernel ke liye sync kar dega
        make CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

    - name: Build Module (.ko)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH="${{ github.workspace }}/toolchain/prebuilts-clang/clang-r485591/bin:$PATH"
        
        # Aapke naye folder 'filetest' me jaakar compilation start karega
        cd ${{ github.workspace }}/filetest
        make CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KERNEL_SRC=${{ github.workspace }}/gki-kernel

    - name: Upload Output File
      uses: actions/artifacts@v4
      with:
        name: OnePlus-13R-Test-Module
        path: filetest/*.ko
