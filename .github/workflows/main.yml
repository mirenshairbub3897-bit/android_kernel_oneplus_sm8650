name: Build Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libelf-dev libssl-dev lld clang llvm make gcc

    - name: Setup kernel source
      run: |
        cd ${{ github.workspace }}
        export ARCH=arm64
        # Prepare kernel config (phone ke kernel source ke liye)
        make LLVM=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
        # Essential for external modules: prepare build environment
        make LLVM=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- modules_prepare

    - name: Build module
      run: |
        cd ${{ github.workspace }}/filetest
        export ARCH=arm64
        make LLVM=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- KDIR=${{ github.workspace }}

    - name: Upload .ko file
      uses: actions/upload-artifact@v4
      with:
        name: hello-module
        path: filetest/*.ko
