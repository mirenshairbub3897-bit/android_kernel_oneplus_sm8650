# .github/workflows/build.yml
name: Build Module Pro
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Forked Code
      uses: actions/checkout@v4
    - name: Install Essential Build Tools & Linker
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libelf-dev libssl-dev rsync lld clang llvm
    - name: Build Module (.ko)
      run: |
        cd filetest
        export ARCH=arm64
        make -C ${{ github.workspace }} M=$(pwd) LLVM=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- modules
    - name: Upload Finished Module
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus-13R-Module
        path: filetest/*.ko
