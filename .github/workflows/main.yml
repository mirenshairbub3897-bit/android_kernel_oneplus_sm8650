name: Build Module Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Forked Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Install Modern Compiling Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev llvm clang

    - name: Get Android Clang Compiler (Full Repo)
      run: |
        mkdir -p ${{ github.workspace }}/toolchain
        # Isme 10-15 minit ka time lagega, hone dena aram se.
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 ${{ github.workspace }}/toolchain --depth=1 --filter=blob:none

    - name: Prepare Kernel Configuration
      run: |
        # FIX: Ab kisi sub-folder me nahi jana, direct main workspace me chalega
        cd ${{ github.workspace }}
        
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH="${{ github.workspace }}/toolchain/clang-r485591/bin:$PATH"
        if [ ! -d "${{ github.workspace }}/toolchain/clang-r485591" ]; then
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
        fi
        
        # Aapne .config main page par hi daali hai, toh yeh use direct verify karega
        make CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

    - name: Build Module (.ko)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH="${{ github.workspace }}/toolchain/clang-r485591/bin:$PATH"
        if [ ! -d "${{ github.workspace }}/toolchain/clang-r485591" ]; then
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
        fi
        
        # filetest folder me jaakar compile karein
        cd ${{ github.workspace }}/filetest
        
        # FIX: KDIR ka path ab direct main workspace ko point karega
        make CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KDIR=${{ github.workspace }}

    - name: Upload Finished Module
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus-13R-Module
        path: filetest/*.ko
