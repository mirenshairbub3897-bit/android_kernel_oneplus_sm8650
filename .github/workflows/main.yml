name: Build Module Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Forked Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Install Modern Compiling Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev llvm clang binutils-aarch64-linux-gnu

    - name: Get Android Clang Compiler (Full Repo)
      run: |
        mkdir -p ${{ github.workspace }}/toolchain
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 ${{ github.workspace }}/toolchain --depth=1 --filter=blob:none

    - name: Prepare Kernel Configuration
      run: |
        cd ${{ github.workspace }}
        
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH="${{ github.workspace }}/toolchain/clang-r485591/bin:$PATH"
        if [ ! -d "${{ github.workspace }}/toolchain/clang-r485591" ]; then
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
        fi
        
        # LLVM=1 aur LD=ld.lld force kiya hai taaki naya linker direct use ho
        make LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

    - name: Build Module (.ko)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PATH="${{ github.workspace }}/toolchain/clang-r485591/bin:$PATH"
        if [ ! -d "${{ github.workspace }}/toolchain/clang-r485591" ]; then
          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
        fi
        
        cd ${{ github.workspace }}/filetest
        
        # Compilation me bhi LLVM aur naye Linker ko active rakha hai
        make LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- KDIR=${{ github.workspace }}

    - name: Upload Finished Module
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus-13R-Module
        path: filetest/*.ko
