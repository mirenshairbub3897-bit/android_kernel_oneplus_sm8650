name: Check Folder Name Only

on:
  workflow_dispatch:

jobs:
  check-name:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Print All Folder Names
      run: |
        echo "--- AAPKE KERNEL FOLDER KA ASLI NAAM NICHE HAI ---"
        ls -d */
